<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的个人网站</title>

    <style>
        /* 整个网页 */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: white;
            color: black;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        /* 顶部文字 */
        .top {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .top h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
        }

        .top p {
            margin: 0;
            font-size: 16px;
        }

        /* 图片所在区域 */
        .center {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 正方形 GIF */
        .center img {
            width: 60vmin;
            height: 60vmin;

            object-fit: contain;
            display: block;
        }

        /* 手机 */
        @media (max-width: 600px) {
            .top h1 {
                font-size: 26px;
            }

            .top p {
                font-size: 14px;
            }

            .center img {
                width: 75vmin;
                height: 75vmin;
            }
        }
    </style>
</head>

<body>

    <!-- 最上面的文字 -->
    <div class="top">
        <h1>你好！👋</h1>
        <p>欢迎来到我的个人网站</p>
    </div>

    <!-- 网页正中央的 GIF -->
    <div class="center">
        <img src="shenkong.gif" alt="shenkong">
    </div>

</body>
</html>
