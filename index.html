<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title></title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        /* =========================
           第一页：lei 背景
        ========================= */

        #home {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background-image: url("lei.jepg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================
           白色镂空圆形按钮
        ========================= */

        #enterButton {

            position: absolute;

            left: 50%;

            /*
             * 原来是 17%
             * 现在向上移动约一个圆直径
             */
            bottom: 26%;

            transform: translateX(-50%);

            width: 58px;
            height: 58px;

            padding: 0;

            /*
             * 镂空圆环
             */
            border: 4px solid rgba(255, 255, 255, 0.95);

            border-radius: 50%;

            /*
             * 中间完全透明
             */
            background: transparent;

            cursor: pointer;

            /*
             * 柔和的白色光晕
             */
            box-shadow:
                0 0 8px rgba(255, 255, 255, 0.55),
                0 0 18px rgba(255, 255, 255, 0.25);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }


        /* 点击效果 */

        #enterButton:active {

            transform:
                translateX(-50%)
                scale(0.9);

            box-shadow:
                0 0 5px rgba(255, 255, 255, 0.5),
                0 0 12px rgba(255, 255, 255, 0.2);
        }


        /* =========================
           时间和日期
        ========================= */

        #clock {

            position: absolute;

            left: 50%;

            /*
             * 原来是 10%
             * 现在整体向上移动约半个圆直径
             */
            bottom: 15%;

            transform: translateX(-50%);

            width: 240px;

            text-align: center;

            color: #111;

            /*
             * 圆润字体优先
             */
            font-family:
                "Arial Rounded MT Bold",
                "Nunito",
                "Microsoft YaHei",
                sans-serif;

            /*
             * 加粗
             */
            font-weight: 700;

            user-select: none;
        }


        /* 时间 */

        #time {

            font-size: 26px;

            line-height: 1.2;

            letter-spacing: 1px;
        }


        /* 日期 */

        #date {

            margin-top: 6px;

            font-size: 15px;

            line-height: 1.2;

            letter-spacing: 0.5px;
        }


        /* =========================
           第二页
        ========================= */

        #page2 {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: white;

            display: none;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px;
        }


        #page2 h1 {

            margin: 0;

            color: #222;

            font-family:
                "Arial Rounded MT Bold",
                "Nunito",
                "Microsoft YaHei",
                sans-serif;

            font-size: 28px;

            font-weight: 700;
        }

    </style>
</head>


<body>


    <!-- =========================
         第一页
    ========================= -->

    <div id="home">


        <!-- 白色镂空圆环 -->

        <button
            id="enterButton"
            aria-label="进入网站">
        </button>


        <!-- 时间和日期 -->

        <div id="clock">

            <div id="time">
                00:00
            </div>

            <div id="date">
                2026年9月19日
            </div>

        </div>


    </div>



    <!-- =========================
         第二页
    ========================= -->

    <div id="page2">

        <h1>
            这是我创建的第一个网站
        </h1>

    </div>



    <script>

        /* =========================
           实时时间
        ========================= */

        function updateClock() {

            const now = new Date();


            const hours =
                String(now.getHours())
                .padStart(2, "0");

            const minutes =
                String(now.getMinutes())
                .padStart(2, "0");


            document.getElementById("time")
                .textContent =
                hours + ":" + minutes;


            const year =
                now.getFullYear();

            const month =
                now.getMonth() + 1;

            const day =
                now.getDate();


            document.getElementById("date")
                .textContent =
                year + "年" +
                month + "月" +
                day + "日";
        }


        updateClock();

        setInterval(updateClock, 1000);



        /* =========================
           点击圆环
        ========================= */

        const button =
            document.getElementById("enterButton");

        const home =
            document.getElementById("home");

        const page2 =
            document.getElementById("page2");


        button.addEventListener(
            "click",
            function () {

                home.style.display = "none";

                page2.style.display = "flex";

            }
        );

    </script>


</body>
</html>
