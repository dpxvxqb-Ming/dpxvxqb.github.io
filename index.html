<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的个人网站</title>

    <style>
        /* 整个网页 */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            /* GIF 背景 */
            background-image: url("shenkong.gif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            /* 文字颜色 */
            color: white;

            /* 字体 */
            font-family: Arial, "Microsoft YaHei", sans-serif;

            /* 居中 */
            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        /* 黑色半透明遮罩，让文字更加清楚 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.25);

            z-index: -1;
        }

        /* 中间内容 */
        .content {
            padding: 40px;
        }

        /* 大标题 */
        h1 {
            font-size: 50px;
            margin-bottom: 20px;

            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* 普通文字 */
        p {
            font-size: 20px;
            margin: 10px 0;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>

<body>

    <div class="content">
        <h1>你好！👋</h1>

        <p>欢迎来到我的个人网站。</p>

        <p>这是我自己创建的第一个网站！</p>
    </div>

</body>
</html>
