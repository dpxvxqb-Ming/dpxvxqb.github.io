<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的个人网站</title>

    <style>
        /* 页面基础设置 */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, "Microsoft YaHei", sans-serif;

            /* 防止出现多余滚动条 */
            overflow: hidden;
        }

        /* 顶部文字 */
        .top {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;

            text-align: center;

            padding: 20px 10px;
            box-sizing: border-box;

            z-index: 10;
        }

        .top h1 {
            margin: 0 0 8px 0;
            font-size: 32px;

            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .top p {
            margin: 0;
            font-size: 16px;

            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* 中间图片区域 */
        .center {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* GIF 图片 */
        .center img {
            width: 70vmin;
            height: 70vmin;

            max-width: 80vw;
            max-height: 80vh;

            object-fit: contain;

            display: block;
        }

        /* 手机屏幕 */
        @media (max-width: 600px) {

            .top h1 {
                font-size: 26px;
            }

            .top p {
                font-size: 14px;
            }

            .center img {
                width: 80vmin;
                height: 80vmin;

                max-width: 85vw;
                max-height: 70vh;
            }
        }
    </style>
</head>

<body>

    <!-- 顶部文字 -->
    <div class="top">
        <h1>你好！👋</h1>
        <p>欢迎来到我的个人网站</p>
    </div>

    <!-- 中间 GIF -->
    <div class="center">
        <img src="shenkong.gif" alt="我的图片">
    </div>

</body>
</html>
